services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/friendly-garbanzo:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://friendly_garbanzo:friendly_garbanzo@db:5432/friendly_garbanzo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: friendly_garbanzo
      POSTGRES_USER: friendly_garbanzo
      POSTGRES_PASSWORD: friendly_garbanzo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendly_garbanzo -d friendly_garbanzo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
